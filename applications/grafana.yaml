apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: "https://grafana.github.io/helm-charts"
      chart: grafana
      targetRevision: 7.0.19
      helm:
        valueFiles:
          - $values/giropops-senhas/grafana/values.yaml
    - repoURL: "https://github.com/WashingtonRJ/descomplicando-gitops-no-kubernetes-argocd.git"
      targetRevision: feat/day2
      ref: values
  destination:
    namespace: monitoring
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
